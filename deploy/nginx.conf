# $request_uri keeps the ORIGINAL path across the internal redirect that
# try_files makes to /index.html, where $uri is already rewritten and the
# location's own add_header would otherwise replace the admin one. Declared
# here because map belongs to the http context, which this file is included in.
map $request_uri $solstice_robots_tag {
    ~^/admin  "noindex, nofollow, noarchive";
    default   "";
}

# Static file server for the built SPA. This is INSIDE the web container and
# terminates nothing - Traefik owns 80/443 on the host and forwards here. It is
# not a second reverse proxy and must never be given a proxy_pass to the API.
#
# /api is deliberately absent. The SPA calls same-origin relative paths
# (fetch('/api/products')), and Traefik peels those off at the edge with a
# Host(...) && PathPrefix(`/api`) router that outranks the web router. If that
# router is ever removed, requests would fall through to try_files below and be
# answered with index.html - a 200 carrying HTML where JSON was expected, which
# surfaces as a JSON parse error rather than an obvious 404. Worth knowing when
# debugging.

server {
    # 8080, not 80: nothing needs a privileged port inside the container.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # One host, one canonical. Traefik routes solsticellp.com AND
    # www.solsticellp.com to this container, so without this both answer 200
    # and every page exists at two URLs - duplicate content competing with
    # itself, and the split of whatever authority either earns. The apex is the
    # canonical host (see index.html), so www is redirected here rather than at
    # the edge: this file ships with the image and cannot drift from the build
    # it was tested against. 301, permanent: the www host is not coming back.
    if ($http_host ~* ^www\.) {
        return 301 https://solsticellp.com$request_uri;
    }

    # Vite emits content-hashed filenames into /assets, so they can be cached
    # permanently. This mirrors the immutable header vercel.json already sets on
    # the production deploy.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Unhashed static media (hero images, journey frames, favicons). One week,
    # matching vercel.json.
    location ~* \.(png|jpe?g|webp|avif|svg|ico|woff2?|mp4|webm)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
    }

    # index.html itself must never be cached, or a deploy leaves browsers
    # pinned to a stale bundle graph.
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        # Repeated, not inherited: nginx REPLACES the inherited add_header set
        # the moment a level declares one of its own, and every admin URL is
        # ultimately served from here by try_files. Without this line the
        # noindex silently vanishes on exactly the paths that need it.
        add_header X-Robots-Tag $solstice_robots_tag always;
    }

    # Belt and braces with deploy/robots.staging.txt and the Traefik middleware.
    # The admin is client-rendered and must never be indexed. A meta tag would
    # not do it: a crawler that does not execute JavaScript sees only the SPA
    # shell, so the instruction has to come from the server. This covers
    # /admin and every path beneath it, including /admin/login.
    location ^~ /admin {
        try_files $uri $uri/ /index.html;
    }

    # Set once, at server level, from the map above: an add_header inside the
    # location that finally serves the file (/index.html) would drop it.
    add_header X-Robots-Tag $solstice_robots_tag always;

    location = /robots.txt {
        add_header X-Robots-Tag "noindex, nofollow, noarchive";
    }

    # /prerender is an implementation detail of the rules below, not a URL. A
    # crawler that found /prerender/about/index.html would index the same page
    # at a second address and split it against itself, so the path is refused
    # from outside. `internal` does not affect the try_files lookups: try_files
    # serves a matched file directly from `root` without re-evaluating
    # locations.
    location ^~ /prerender/ {
        internal;
    }

    # What exists is decided here, and each route is served its PRERENDERED
    # copy when one exists.
    #
    # Order of candidates: the prerendered HTML (a real <head> and the full DOM,
    # which is what a crawler that runs no JavaScript needs), then a real file,
    # then the SPA shell. Falling through to the shell is what makes the
    # prerender job safe to fail - an unrendered route still works, just
    # client-rendered as before.
    #
    # __SHELL_ID__ is replaced at image build time with a hash of this image's
    # own index.html (deploy/web.Dockerfile). The job files its output under the
    # hash of the shell it rendered from, so nginx only ever serves HTML whose
    # /assets/ references exist in THIS image. Right after a deploy nothing
    # matches and pages are client-rendered until the watcher catches up - never
    # unstyled, never a broken bundle reference.
    #
    # The route list is the server-side copy of KNOWN_ROUTES in
    # src/app/router.js. A blanket fallback would answer 200 + shell for every
    # typo and probe on the internet - soft 404s, which Google classes as thin
    # content - so anything not listed falls through to the 404 at the bottom.
    # scripts/check-routes.mjs fails the build if the two lists drift apart.
    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag $solstice_robots_tag always;
        try_files /prerender/shell-__SHELL_ID__/index.html /index.html =404;
    }

    # The flat pages are exactly themselves: /about is a page, /about/extra is
    # not, and answering 200 for the second invents a URL for anything that
    # links at it.
    location ~ ^/(about|services|team|trade-network|gallery|contact|products)/?$ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag $solstice_robots_tag always;
        try_files /prerender/shell-__SHELL_ID__$uri/index.html $uri /index.html;
    }

    # /products is the one route with a tree beneath it: direction filters,
    # category lists and product detail pages.
    location ~ ^/products/ {
        add_header Cache-Control "no-cache, must-revalidate";
        add_header X-Robots-Tag $solstice_robots_tag always;
        try_files /prerender/shell-__SHELL_ID__$uri/index.html $uri /index.html;
    }

    # /network was the internal route name; /trade-network is the URL. Anything
    # already pointing at the old name keeps its visitor and its link equity.
    location = /network {
        return 301 https://solsticellp.com/trade-network;
    }

    # The shell-* and current entries are symlinks the prerender job repoints
    # atomically. nginx follows them (disable_symlinks is off by default), and a
    # file already open keeps its build alive until the response completes. The
    # sitemap references no assets, so it follows `current` across deploys.
    location = /sitemap.xml {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /prerender/current/sitemap.xml =404;
    }

    # Everything else: a real file, or a real 404.
    location / {
        try_files $uri =404;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
