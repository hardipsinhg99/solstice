<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f7f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0e1c16" media="(prefers-color-scheme: dark)" />

    <!-- Theme bootstrap. Must run before first paint: ThemeProvider applies the
         theme in an effect, which lands *after* the first frame, so a returning
         dark-theme buyer got a full flash of the light palette. Setting the
         attribute here makes the first painted frame already correct, and
         ThemeProvider reads its initial state back off this element.
         localStorage throws in sandboxed/blocked-cookie contexts - hence try. -->
    <script>
      (function () {
        var theme = 'light'
        try {
          theme = localStorage.getItem('solstice-theme') ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
        } catch (e) { /* storage blocked - fall through to light */ }
        document.documentElement.dataset.theme = theme
      })()
    </script>

    <!-- Fonts are linked here, not @import-ed from index.css. An @import inside a
         stylesheet cannot start until that stylesheet has downloaded AND parsed,
         which serialises two round-trips onto the critical path before a single
         glyph is requested. preconnect warms the TLS handshake in parallel. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://images.unsplash.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Playfair+Display:wght@500;600&display=swap"
    />

    <!-- ==========================================================================
         CONFIRM BEFORE DEPLOY: every absolute URL below assumes the production
         origin is https://solsticetrading.com/ (inferred from the enquiry address
         in src/main.jsx). If the live domain differs, update canonical, og:url
         and og:image together - a wrong canonical is worse than none.

         Phase 0 note: hash routing means all seven routes share this one <head>,
         so these tags describe the site, not the page. Per-route metadata arrives
         with the Astro rebuild; this ships now only because link previews are
         currently blank wherever the URL is shared.
         ========================================================================== -->

    <title>Solstice Trading International LLP | Fresh Produce Exporter from India</title>
    <meta name="description" content="Indian exporter of fresh fruit, vegetables, spices and food staples - mangoes, pomegranates, grapes, onions and okra. Export cartons, phytosanitary certification and enquiries welcome from international buyers." />
    <link rel="canonical" href="https://solsticetrading.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Solstice Trading International LLP" />
    <meta property="og:title" content="Solstice Trading International LLP | Fresh Produce Exporter from India" />
    <meta property="og:description" content="Fresh fruit, vegetables, spices and essential foods sourced across India for international buyers. Send a product enquiry with your destination and pack requirement." />
    <meta property="og:url" content="https://solsticetrading.com/" />
    <meta property="og:image" content="https://solsticetrading.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Solstice Trading International LLP" />
    <meta property="og:locale" content="en_IN" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Solstice Trading International LLP | Fresh Produce Exporter from India" />
    <meta name="twitter:description" content="Fresh fruit, vegetables, spices and essential foods sourced across India for international buyers." />
    <meta name="twitter:image" content="https://solsticetrading.com/og-image.png" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  </head>
  <body>
    <!-- Google's widget container is a SIBLING of #root, never a descendant, and
         that placement is the whole point rather than a detail.

         Google Translate rewrites live text nodes, wrapping them in <font> tags
         that React knows nothing about. React's virtual DOM still believes the
         original text node is a child of its parent, so the next reconciliation
         that touches the subtree calls parent.removeChild(originalNode) on a node
         Google has since reparented - "Failed to execute 'removeChild' on 'Node'",
         thrown mid-commit, no recovery path, white screen. In this app every hash
         route change replaces the whole <main> subtree, so translated page content
         would make route changes a crash on a timer.

         Keeping the container outside #root means React never owns these nodes and
         can never try to remove one. It is positioned into the header visually, by
         CSS - see useTranslateSlot.js. It is never moved in the DOM, because
         moving it back under #root would reintroduce exactly the bug it avoids.

         Deliberately NOT aria-hidden. It is empty until Google fills it, but what
         Google puts in it is a focusable <select>, and a focusable control inside
         an aria-hidden subtree is the phantom-focus defect of SC 4.1.2 - hidden
         from assistive tech while still catching a Tab. The <select> carries its
         own aria-label from Google.

         Being a sibling of #root also fixes its position in the tab order: it is
         the first focusable thing in the document, not a stop between the nav and
         the theme toggle where it sits visually. DOM order is what drives tab
         order, and DOM order here is dictated by the containment. -->
    <div id="google_translate_element"></div>
    <div id="root"></div>

    <!-- Defined before the loader so the callback exists whenever Google calls it.
         Every guard here is deliberate: ad blockers block this specific widget very
         commonly, so google.translate may never exist. In that case the callback
         simply never fires, the container stays empty, and the header slot collapses
         to zero width - no gap, no error thrown by our code. -->
    <script>
      window.googleTranslateElementInit = function () {
        var t = window.google && window.google.translate && window.google.translate.TranslateElement
        if (!t) return
        new t(
          {
            pageLanguage: 'en',
            // The markets the site actually names: UAE, Vietnam, China, plus the
            // source language so a reader can get back to English.
            includedLanguages: 'ar,vi,zh-CN,en',
            // HORIZONTAL, not SIMPLE. Verified against the live widget: SIMPLE
            // now renders `goog-te-gadget-simple` - an <a> plus a Google-drawn
            // menu, no <select> anywhere - while HORIZONTAL still renders the
            // native <select class="goog-te-combo"> with tabIndex 0. The native
            // control is what makes this keyboard-operable without wrapping it,
            // and .goog-te-combo is the hook the restyling needs.
            layout: t.InlineLayout.HORIZONTAL,
            // Google otherwise auto-shows its banner on first visit, which is the
            // thing that pushes the whole document down by ~40px.
            autoDisplay: false
          },
          'google_translate_element'
        )
      }
    </script>
    <!-- The loader is deliberately NOT here. It is injected by
         useTranslateSlot only when the admin's "Language selector" setting is
         on, so switching it off means the request to translate.google.com is
         never made rather than being made and then hidden. The callback above
         stays defined either way, because Google calls it by name. -->

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
